name: Build and smoke test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build images and start services
        run: docker compose up --build -d --wait --wait-timeout 120
      - name: Verify frontend proxy, REST and MCP
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8081/ > /dev/null
          python3 scripts/smoke.py --base-url http://127.0.0.1:8081 --mcp-url http://127.0.0.1:8082/mcp
      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down --volumes
