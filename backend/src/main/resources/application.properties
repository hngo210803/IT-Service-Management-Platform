server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5433/itsm}
spring.datasource.username=${DB_USER:itsm}
spring.datasource.password=${DB_PASSWORD:itsm_local}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
itsm.ollama-url=${OLLAMA_URL:http://127.0.0.1:11434}
itsm.chat-model=${OLLAMA_CHAT_MODEL:qwen3:4b}
itsm.embedding-model=${OLLAMA_EMBED_MODEL:bge-m3}
itsm.mcp-url=http://127.0.0.1:${server.port}/mcp

# La base est nécessaire aux tickets. Ollama reste facultatif pour démarrer le service.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
