name: itsm-platform

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: itsm
      POSTGRES_USER: itsm
      POSTGRES_PASSWORD: itsm_local
    ports:
      - "127.0.0.1:${ITSM_DB_PORT:-5433}:5432"
    volumes:
      - tickets:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "itsm", "-d", "itsm"]
      interval: 3s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    image: itsm-backend:local
    environment:
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: jdbc:postgresql://postgres:5432/itsm
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    ports:
      - "127.0.0.1:${ITSM_BACKEND_PORT:-8082}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  frontend:
    build: ./frontend
    image: itsm-frontend:local
    ports:
      - "127.0.0.1:${ITSM_WEB_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  tickets:
